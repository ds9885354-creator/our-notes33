<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CozyCorner - Shared Notes & Check-ins</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              50: '#f4f7f4',
              100: '#e3eae3',
              200: '#c7d6c8',
              300: '#a3bda4',
              400: '#7a9d7b',
              500: '#5c7f5d',
              600: '#466447',
              700: '#39503a',
            },
            warm: {
              50: '#fdfbf7',
              100: '#f7f2e8',
              200: '#efe4d2',
              300: '#e2cfb2',
              400: '#d0b38c',
              500: '#bf9868',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(92, 127, 93, 0.05); border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(92, 127, 93, 0.25); border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(92, 127, 93, 0.4); }
  </style>
</head>
<body class="bg-gradient-to-br from-warm-50 via-sage-50 to-emerald-50/30 min-h-screen font-sans text-slate-700 flex flex-col antialiased selection:bg-sage-200">

  <div class="relative z-10 flex flex-col min-h-screen max-w-4xl mx-auto w-full px-4 py-6">

    <header class="bg-white/85 backdrop-blur-md rounded-2xl p-4 sm:p-5 shadow-sm border border-sage-100 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sage-500 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-sage-200/50 text-lg font-bold">
          <i class="fa-solid fa-mug-hot"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            CozyCorner <span class="text-xs bg-sage-100 text-sage-700 px-2 py-0.5 rounded-full font-medium border border-sage-200">Shared Notes</span>
          </h1>
          <p class="text-xs text-slate-500 flex items-center gap-1.5 mt-0.5">
            <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
            <span id="syncStatusText">Local Storage Mode</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button id="btnGuide" class="px-3.5 py-2 text-xs font-semibold text-sage-700 bg-sage-50 hover:bg-sage-100 rounded-xl border border-sage-200 transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-book-open"></i> Setup Guide
        </button>
        <button id="btnSettings" class="px-3.5 py-2 text-xs font-semibold text-white bg-sage-600 hover:bg-sage-700 rounded-xl shadow-sm transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-key"></i> Sync Settings
        </button>
      </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
      <section class="lg:col-span-5 bg-white/90 backdrop-blur-md rounded-2xl p-5 shadow-sm border border-sage-100 space-y-4">
        <div class="flex items-center justify-between border-b border-sage-100 pb-3">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-sage-600"></i> Drop a Note
          </h2>
          <span class="text-xs text-sage-600 font-medium bg-sage-50 px-2 py-0.5 rounded-full border border-sage-100">
            Easy Check-in
          </span>
        </div>

        <form id="messageForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Who is posting?</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="senderHer" class="sender-btn py-2 px-3 text-xs font-medium rounded-xl border border-sage-300 bg-sage-50 text-sage-700 flex items-center justify-center gap-2 transition-all shadow-sm">
                <i class="fa-solid fa-face-smile text-sage-600"></i> Her
              </button>
              <button type="button" id="senderMe" class="sender-btn py-2 px-3 text-xs font-medium rounded-xl border border-slate-200 bg-white text-slate-600 flex items-center justify-center gap-2 transition-all hover:bg-slate-50">
                <i class="fa-solid fa-user text-slate-400"></i> Me
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Category</label>
            <select id="msgCategory" class="w-full text-xs font-medium rounded-xl border border-slate-200 p-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sage-400 transition-all">
              <option value="☕ Daily Catch-up">☕ Daily Catch-up</option>
              <option value="🍕 Food & Snacks">🍕 Food & Snacks Wishlist</option>
              <option value="🎬 Movies & Shows">🎬 Movie / Show Idea</option>
              <option value="💭 Random Thought">💭 Random Thought</option>
              <option value="✨ Quick Reminder">✨ Quick Reminder</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">How are you feeling?</label>
            <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-200 text-lg">
              <button type="button" data-mood="😊 Chill" class="mood-btn p-1.5 rounded-lg hover:bg-sage-100 transition-all text-sage-700 bg-sage-100">😊</button>
              <button type="button" data-mood="😌 Peaceful" class="mood-btn p-1.5 rounded-lg hover:bg-sage-100 transition-all">😌</button>
              <button type="button" data-mood="🥳 Excited" class="mood-btn p-1.5 rounded-lg hover:bg-sage-100 transition-all">🥳</button>
              <button type="button" data-mood="😴 Tired" class="mood-btn p-1.5 rounded-lg hover:bg-sage-100 transition-all">😴</button>
              <button type="button" data-mood="😋 Hungry" class="mood-btn p-1.5 rounded-lg hover:bg-sage-100 transition-all">😋</button>
              <button type="button" data-mood="🤯 Busy" class="mood-btn p-1.5 rounded-lg hover:bg-sage-100 transition-all">🤯</button>
            </div>
            <input type="hidden" id="selectedMood" value="😊 Chill">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="msgText" class="text-xs font-semibold text-slate-600">Note Content</label>
              <span id="charCounter" class="text-[10px] text-slate-400">0 / 500</span>
            </div>
            <textarea id="msgText" rows="4" maxlength="500" placeholder="Drop a quick note or update..." class="w-full text-xs rounded-xl border border-slate-200 p-3 focus:outline-none focus:ring-2 focus:ring-sage-400 transition-all bg-slate-50/50 focus:bg-white resize-none custom-scrollbar" required></textarea>
          </div>

          <div class="flex flex-wrap gap-1.5 pt-1">
            <button type="button" data-quick="Hope your day is going awesome! 🌿" class="quick-prompt text-[11px] bg-sage-50 text-sage-700 hover:bg-sage-100 px-2.5 py-1 rounded-lg border border-sage-200 transition-all">Have a great day 🌿</button>
            <button type="button" data-quick="What should we eat later? 🍜" class="quick-prompt text-[11px] bg-sage-50 text-sage-700 hover:bg-sage-100 px-2.5 py-1 rounded-lg border border-sage-200 transition-all">What to eat? 🍜</button>
            <button type="button" data-quick="Tell me when you are free! ☕" class="quick-prompt text-[11px] bg-sage-50 text-sage-700 hover:bg-sage-100 px-2.5 py-1 rounded-lg border border-sage-200 transition-all">Free later? ☕</button>
          </div>

          <button type="submit" id="btnSubmitMsg" class="w-full py-2.5 bg-sage-600 hover:bg-sage-700 text-white font-semibold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
            <span>Post Note</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
      </section>

      <section class="lg:col-span-7 bg-white/90 backdrop-blur-md rounded-2xl p-5 shadow-sm border border-sage-100 flex flex-col h-[580px]">
        <div class="flex items-center justify-between border-b border-sage-100 pb-3 mb-4 flex-shrink-0">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-clipboard-list text-sage-600"></i> Board Feed
            </h2>
            <span id="msgCountBadge" class="text-xs bg-sage-100 text-sage-700 px-2 py-0.5 rounded-full font-bold">0 notes</span>
          </div>

          <div class="flex items-center gap-2">
            <button id="btnSyncNow" class="text-xs text-slate-600 hover:text-sage-700 bg-slate-100 hover
